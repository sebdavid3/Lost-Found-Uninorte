version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lost_found_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-lost_found_uninorte}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lost_found_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lost_found_mq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    networks:
      - lost_found_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.17
    container_name: lost_found_consul
    ports:
      - '${CONSUL_PORT:-8500}:8500'
    command: agent -dev -client=0.0.0.0
    networks:
      - lost_found_network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: lost_found_user_service
    ports:
      - '${USER_PUBLIC_PORT:-3002}:3002'
    environment:
      DATABASE_URL: ${USER_DATABASE_URL:-postgresql://admin:password123@db:5432/lost_found_users?schema=public}
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_PORT: ${USER_SERVICE_PORT:-3002}
      PORT: ${USER_SERVICE_PORT:-3002}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    volumes:
      - ./services/user-service/src:/usr/src/app/src
      - ./services/user-service/prisma:/usr/src/app/prisma
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lost_found_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://localhost:$${SERVICE_PORT:-3002}/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c "npx prisma db push && npm run seed && npm run start:prod"

  object-service:
    build:
      context: ./services/object-service
      dockerfile: Dockerfile
    container_name: lost_found_object_service
    ports:
      - '${OBJECT_PUBLIC_PORT:-3003}:3003'
    environment:
      DATABASE_URL: ${OBJECT_DATABASE_URL:-postgresql://admin:password123@db:5432/lost_found_objects?schema=public}
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_PORT: ${OBJECT_SERVICE_PORT:-3003}
      PORT: ${OBJECT_SERVICE_PORT:-3003}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    volumes:
      - ./services/object-service/src:/usr/src/app/src
      - ./services/object-service/prisma:/usr/src/app/prisma
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lost_found_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://localhost:$${SERVICE_PORT:-3003}/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c "npx prisma db push && npm run seed && npm run start:prod"

  claim-service:
    build:
      context: ./services/claim-service
      dockerfile: Dockerfile
    container_name: lost_found_claim_service
    ports:
      - '${CLAIMS_PUBLIC_PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${CLAIMS_DATABASE_URL:-postgresql://admin:password123@db:5432/lost_found_claims?schema=public}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      NODE_ENV: ${NODE_ENV:-development}
      CONSUL_HOST: ${CONSUL_HOST:-consul}
      CONSUL_PORT: '8500'
      SERVICE_HOST: ${CLAIMS_SERVICE_HOST:-claim-service}
      SERVICE_PORT: ${CLAIMS_SERVICE_PORT:-3000}
      PORT: ${CLAIMS_SERVICE_PORT:-3000}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3002}
      OBJECT_SERVICE_URL: ${OBJECT_SERVICE_URL:-http://object-service:3003}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    volumes:
      - ./services/claim-service/src:/usr/src/app/src
      - ./services/claim-service/prisma:/usr/src/app/prisma
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
      user-service:
        condition: service_started
      object-service:
        condition: service_started
    networks:
      - lost_found_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://localhost:$${SERVICE_PORT:-3000}/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c "npx prisma db push && npx prisma db seed && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLAIMS_API_URL: http://127.0.0.1:${CLAIMS_PUBLIC_PORT:-3000}
        VITE_AUDIT_API_URL: http://127.0.0.1:${AUDIT_PUBLIC_PORT:-3001}
        VITE_USER_API_URL: http://127.0.0.1:${USER_PUBLIC_PORT:-3002}
        VITE_OBJECT_API_URL: http://127.0.0.1:${OBJECT_PUBLIC_PORT:-3003}
    container_name: lost_found_frontend
    ports:
      - '${FRONTEND_PUBLIC_PORT:-5173}:80'
    depends_on:
      claim-service:
        condition: service_healthy
      user-service:
        condition: service_started
      object-service:
        condition: service_started
    networks:
      - lost_found_network
    restart: unless-stopped

  audit-db:
    image: postgres:15-alpine
    container_name: lost_found_audit_db
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-admin}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-password123}
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit_log_db}
    ports:
      - '${AUDIT_DB_PORT:-5433}:5432'
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lost_found_network
    restart: unless-stopped

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: lost_found_audit_service
    ports:
      - '${AUDIT_PUBLIC_PORT:-3001}:3001'
    environment:
      DATABASE_URL: ${AUDIT_DATABASE_URL:-postgresql://admin:password123@audit-db:5432/audit_log_db?schema=public}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_PORT: ${AUDIT_SERVICE_PORT:-3001}
      PORT: ${AUDIT_SERVICE_PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    volumes:
      - ./services/audit-service/src:/usr/src/app/src
      - ./services/audit-service/prisma:/usr/src/app/prisma
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lost_found_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://localhost:$${SERVICE_PORT:-3001}/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c "npx prisma db push && npm run seed && npm run start:prod"

networks:
  lost_found_network:
    driver: bridge

volumes:
  postgres_data:
  audit_postgres_data:
